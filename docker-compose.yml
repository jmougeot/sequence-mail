# VPS deployment: the Node app + Caddy (automatic HTTPS via Let's Encrypt).
# Caddy leaves the public tracking routes (/p/, /t/) open and password-protects
# everything else (dashboard, API, OAuth).
services:
  app:
    # Image published by GitHub Actions (no build on the server);
    # `docker compose build` rebuilds from source if needed.
    image: ghcr.io/jmougeot/sequence-mail:latest
    build: .
    restart: unless-stopped
    # Settings from .env (BASE_URL, VISIT_*, quotas…)
    env_file: .env
    environment:
      - DATA_DIR=/data
      - PORT=3000
    volumes:
      - sequence-data:/data # SQLite database
    expose:
      - "3000" # reachable from Caddy only, not published

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # TLS certificates
      - caddy-config:/config
    depends_on:
      - app

volumes:
  sequence-data:
  caddy-data:
  caddy-config:
