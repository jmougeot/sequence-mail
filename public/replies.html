<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Mail — Réponses</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body class="inbox-page">
<div class="inbox" id="inbox">
  <section class="ib-list">
    <div class="ib-list-head">
      <div class="ib-tabs" id="tabs">
        <button data-tab="todo" class="active">À traiter <span id="cTodo"></span></button>
        <button data-tab="done">Traitées</button>
      </div>
      <input id="q" type="search" placeholder="Rechercher">
    </div>
    <div class="ib-items" id="items"><div class="ib-empty">Chargement…</div></div>
  </section>

  <section class="ib-detail" id="detail">
    <div class="ib-placeholder"></div>
  </section>
</div>

<script src="app.js?v=7"></script>
<script>
renderNav("replies.html");

const UNDO_MS = 5000; // délai pendant lequel un envoi peut être annulé
let tab = "todo";
let items = [];
const texts = new Map(); // cc_id → { text, error } : texte de la réponse, lu dans Gmail une fois
let selected = null; // cc_id ouvert
let conv = null; // conversation ouverte
let channel = "email"; // canal de la réponse en cours d'écriture
let pendingSend = null; // envoi en attente (annulable)

const fullName = (x) => [x.first_name, x.last_name].filter(Boolean).join(" ") || x.email || "Contact";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { v === "" || v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

/** « 14:32 » aujourd'hui, « hier », « lun. », « 12 oct. » */
function when(ms) {
  if (!ms) return "";
  const d = new Date(ms), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((day(now) - day(d)) / 86400e3);
  if (days === 0) return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (days === 1) return "hier";
  if (days < 7) return d.toLocaleDateString("fr-FR", { weekday: "short" });
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
const fullDate = (ms) => (ms ? new Date(ms).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" }) : "");

/**
 * Ce que la personne a écrit, sans le reste : message cité (« Le … a écrit », bloc Outlook
 * « De : … Objet : », lignes en >) et signature (tout ce qui suit la formule de politesse,
 * logos et liens compris). Le texte complet reste affichable.
 */
const QUOTE_STARTS = [
  /^[ \t]*-{2,}[ \t]*(Original Message|Message d'origine|Forwarded message|Message transféré)/im,
  /^[ \t]*_{8,}[ \t]*$/m,
  /^[ \t]*(De|From)[ \t]*:.*\n(?:.*\n){0,5}?[ \t]*(Objet|Subject)[ \t]*:/im,
  /^[ \t]*(Le|On)[ \t][^\n]*(\n[^\n]*)?(a écrit|wrote)[ \t]*:/im,
  /^[ \t]*>/m,
];
const SIGN_OFF = /^(bien |très )?(cordialement|bien à (vous|toi)|à (bientôt|plus)|bonne (journée|soirée|fin de journée|semaine)|sincères salutations|salutations|best( regards)?|kind regards|regards|cheers|merci( beaucoup| d'avance| encore)?|thanks|thank you)[\s,.!]*$/i;
function cleanReply(text) {
  let s = String(text || "").replace(/\r\n/g, "\n");
  const cut = Math.min(...QUOTE_STARTS.map((re) => { const i = s.search(re); return i < 0 ? s.length : i; }));
  s = s.slice(0, cut);
  const lines = s
    .replace(/<https?:\/\/[^>\s]*>/g, "") // liens des signatures (« [web] <https://…> »)
    .split("\n")
    .filter((l) => !/^\s*(\[[^\]]*\]\s*)+$/.test(l)); // logos et icônes en texte (« [logo] [linkedin] »)
  const firstText = lines.findIndex((l) => l.trim());
  const off = lines.findIndex((l, i) => i > firstText && SIGN_OFF.test(l.trim()));
  const kept = off >= 0 ? lines.slice(0, off + 1) : lines;
  return kept.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

// ───────────────────────────── Liste ─────────────────────────────

const query = (includeText) =>
  `/api/inbox?status=replied,opted_out&limit=200&done=${tab === "done" ? 1 : 0}${includeText ? "&include_text=1" : ""}`;

async function loadList() {
  const url = query(false);
  try {
    const rows = await api(url);
    if (url !== query(false)) return; // onglet changé entre-temps
    items = rows;
    renderList();
    loadTexts(url);
  } catch (e) {
    $("#items").innerHTML = `<div class="ib-empty err">${esc(e.message)}</div>`;
  }
  refreshCounts();
}

/** Textes des réponses (lus dans Gmail) : en second temps, pour afficher la liste sans attendre. */
async function loadTexts(listUrl) {
  if (items.every((i) => texts.has(i.cc_id))) return;
  try {
    for (const r of await api(query(true))) texts.set(r.cc_id, { text: r.reply_text ?? null, error: r.reply_error ?? null });
    if (listUrl === query(false)) renderList();
  } catch {}
}

async function refreshCounts() {
  try {
    const { todo } = await api("/api/inbox/counts");
    $("#cTodo").textContent = todo || "";
  } catch {}
  refreshNavBadge();
}

function visibleItems() {
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return items;
  return items.filter((i) => [fullName(i), i.company, i.email].filter(Boolean).join(" ").toLowerCase().includes(q));
}

function snippet(i) {
  const t = texts.get(i.cc_id);
  const s = t?.text ? cleanReply(t.text).replace(/\s+/g, " ") : "";
  return s ? `<div class="snip">${esc(s)}</div>` : `<div class="snip wait">${t ? (i.channel === "linkedin" ? "Réponse sur LinkedIn" : "") : "…"}</div>`;
}

function renderList() {
  const list = visibleItems();
  if (!list.length) {
    $("#items").innerHTML = `<div class="ib-empty">${tab === "todo" ? "Rien à traiter." : "Aucune réponse traitée."}</div>`;
    return;
  }
  $("#items").innerHTML = list.map((i) => `
    <div class="ib-item ${i.cc_id === selected ? "sel" : ""} ${i.seen ? "" : "unseen"}" data-cc="${i.cc_id}">
      <div class="l1">
        <span class="who">${esc(fullName(i))}</span>
        ${i.status === "opted_out" ? `<span class="refus">refus</span>` : ""}
        <span class="when" title="${esc(fullDate(i.replied_at))}">${i.channel === "linkedin" ? `<span class="li-mini">in</span>` : ""}${esc(when(i.replied_at))}</span>
      </div>
      <div class="co">${esc(i.company || "")}</div>
      ${snippet(i)}
    </div>`).join("");
}

$("#items").addEventListener("click", (e) => {
  const el = e.target.closest(".ib-item");
  if (el) openReply(Number(el.dataset.cc));
});
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || b.dataset.tab === tab) return;
  tab = b.dataset.tab;
  $$("#tabs button").forEach((x) => x.classList.toggle("active", x === b));
  loadList();
});
$("#q").addEventListener("input", renderList);

// ───────────────────────────── Conversation ─────────────────────────────

async function openReply(ccId, { keepChannel = false } = {}) {
  if (pendingSend) return notify("Un envoi est en attente : annulez-le ou attendez qu'il parte.", false);
  selected = ccId;
  history.replaceState(null, "", `#cc=${ccId}`);
  $("#inbox").classList.add("open");
  renderList();
  if (!keepChannel) $("#detail").innerHTML = `<div class="ib-placeholder">Chargement…</div>`;
  try {
    const c = await api(`/api/campaign-contacts/${ccId}/conversation`);
    if (selected !== ccId) return;
    conv = c;
    const item = items.find((i) => i.cc_id === ccId);
    if (!keepChannel) channel = defaultChannel(c, item);
    renderDetail();
    if (!c.seen) {
      api(`/api/campaign-contacts/${ccId}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ seen: true }) })
        .then(() => { if (item) { item.seen = true; renderList(); } refreshCounts(); })
        .catch(() => {});
    }
  } catch (e) {
    $("#detail").innerHTML = `<div class="ib-placeholder err">${esc(e.message)}</div>`;
  }
}

const canEmail = (c) => Boolean(c.contact.email && (c.email_thread || c.gmail_url));
const canLinkedin = (c) => Boolean(c.contact.linkedin || c.li_thread_url);
function defaultChannel(c, item) {
  const preferred = item?.channel ?? (c.li_thread_url ? "linkedin" : "email");
  if (preferred === "email" && canEmail(c)) return "email";
  if (canLinkedin(c)) return "linkedin";
  return canEmail(c) ? "email" : "none";
}

/** Messages échangés, dans l'ordre : emails du fil Gmail, messages LinkedIn, réponse LinkedIn. */
function messages(c) {
  const out = [];
  for (const m of c.email_thread ?? []) {
    if (m.kind === "sent") out.push({ at: m.date, mine: true, text: m.text.trim() });
    else if (m.kind === "reply") out.push({ at: m.date, mine: false, text: m.text.trim() });
  }
  for (const a of c.linkedin ?? []) {
    if (a.status === "sent" && a.type === "message" && a.body) out.push({ at: a.sent_at, mine: true, text: a.body.trim() });
  }
  if (c.li_reply_text) out.push({ at: c.replied_at ?? Date.now(), mine: false, text: c.li_reply_text.trim() });
  return out.sort((x, y) => (x.at ?? 0) - (y.at ?? 0));
}

function bubble(m, who, { clamp = false } = {}) {
  const short = m.mine ? m.text : cleanReply(m.text) || m.text;
  const more = clamp ? "Afficher tout" : short !== m.text ? "Afficher le message complet" : "";
  return `
    <div class="msg ${m.mine ? "out" : "in"} ${clamp ? "clamp" : ""}">
      <div class="msg-h"><b>${esc(who)}</b><span class="t" title="${esc(fullDate(m.at))}">${esc(when(m.at))}</span></div>
      <div class="msg-b" data-short="${esc(short)}" data-full="${esc(m.text)}">${esc(short)}</div>
      ${more ? `<button class="msg-more">${more}</button>` : ""}
    </div>`;
}

function renderThread(c) {
  const all = messages(c);
  if (!all.length) return c.email_thread_error ? `<div class="notice">${esc(c.email_thread_error)}</div>` : "";
  const them = c.contact.first_name || fullName(c.contact);
  // l'essentiel : la réponse, et le message auquel elle répond ; le reste replié
  let lastIn = all.map((m) => !m.mine).lastIndexOf(true);
  if (lastIn < 0) lastIn = all.length - 1;
  const start = Math.max(0, lastIn - 1);
  const older = all.slice(0, start);
  const html = [];
  if (older.length) {
    html.push(`<button class="older" id="older">${older.length} message${older.length > 1 ? "s" : ""} précédent${older.length > 1 ? "s" : ""}</button>`);
    html.push(`<div id="olderList" hidden>${older.map((m) => bubble(m, m.mine ? "Vous" : them, { clamp: m.mine })).join("")}</div>`);
  }
  all.slice(start).forEach((m, i, rest) => html.push(bubble(m, m.mine ? "Vous" : them, { clamp: m.mine && i < rest.length - 1 })));
  return html.join("");
}

function renderComposer(c) {
  if (channel === "none") return "";
  const first = c.contact.first_name || fullName(c.contact);
  const other = channel === "email" ? canLinkedin(c) && "linkedin" : canEmail(c) && "email";
  return `
    <div class="composer" id="composer">
      <textarea id="reply" placeholder="${channel === "email" ? `Répondre à ${esc(first)}…` : `Message LinkedIn à ${esc(first)}…`}">${esc(store.get(`draft:${c.cc_id}:${channel}`, ""))}</textarea>
      <div class="cfoot" id="cfoot">
        ${channel === "email" ? `<button id="send">Envoyer</button>` : `<button id="copyLi">Copier et ouvrir LinkedIn</button>`}
        <span class="spacer"></span>
        ${other ? `<button class="link-btn" id="switch">${other === "email" ? "Répondre par email" : "Répondre sur LinkedIn"}</button>` : ""}
      </div>
    </div>`;
}

function renderDetail() {
  const c = conv;
  const extra = c.contact.extra || {};
  const liLink = c.li_thread_url || (c.contact.linkedin ? liUrl(c.contact.linkedin) : "");
  $("#detail").innerHTML = `
    <div class="ib-head">
      <button class="icon-btn ib-back" id="back">←</button>
      <div class="id">
        <h2>${esc(fullName(c.contact))}</h2>
        <div class="sub">${esc([extra.poste, c.contact.company].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="acts">
        <button class="${c.done ? "ghost" : ""}" id="done">${c.done ? "Remettre à traiter" : "Traitée ✓"}</button>
        <div class="menu"><button class="icon-btn" id="more">⋯</button>
          <div class="menu-list" id="moreList" hidden>
            ${c.gmail_url ? `<button data-href="${esc(c.gmail_url)}">Ouvrir dans Gmail</button>` : ""}
            ${liLink ? `<button data-href="${esc(liLink)}">Ouvrir sur LinkedIn</button>` : ""}
            <button data-href="campaigns.html#${c.campaign.id}" data-same="1">Voir la campagne</button>
            <button id="unseen">Marquer comme non lue</button>
          </div>
        </div>
      </div>
    </div>
    <div class="ib-thread" id="thread">${renderThread(c)}</div>
    ${renderComposer(c)}`;
  const th = $("#thread");
  th.scrollTop = th.scrollHeight;
  wireDetail();
}

function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.4) + "px"; }

function wireDetail() {
  const c = conv;
  $("#back").onclick = () => { $("#inbox").classList.remove("open"); selected = null; renderList(); };
  $("#done").onclick = () => setDone(!c.done);
  $("#more").onclick = (e) => { e.stopPropagation(); $("#moreList").hidden = !$("#moreList").hidden; };
  $$("#moreList [data-href]").forEach((b) => (b.onclick = () => (b.dataset.same ? (location.href = b.dataset.href) : window.open(b.dataset.href, "_blank", "noopener"))));
  $("#unseen").onclick = async () => {
    await api(`/api/campaign-contacts/${c.cc_id}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ seen: false }) });
    const item = items.find((i) => i.cc_id === c.cc_id);
    if (item) item.seen = false;
    closeDetail();
    refreshCounts();
  };
  const older = $("#older");
  if (older) older.onclick = () => { $("#olderList").hidden = false; older.remove(); };
  $("#thread").addEventListener("click", (e) => {
    const b = e.target.closest(".msg-more");
    if (!b) return;
    const msg = b.closest(".msg"), body = $(".msg-b", msg);
    if (msg.classList.contains("clamp")) { msg.classList.remove("clamp"); b.remove(); return; }
    const full = b.textContent.startsWith("Afficher");
    body.textContent = full ? body.dataset.full : body.dataset.short;
    b.textContent = full ? "Masquer" : "Afficher le message complet";
  });
  const sw = $("#switch");
  if (sw) sw.onclick = () => { channel = channel === "email" ? "linkedin" : "email"; renderDetail(); $("#reply").focus(); };
  const ta = $("#reply");
  if (!ta) return;
  autosize(ta);
  ta.addEventListener("input", () => { autosize(ta); store.set(`draft:${c.cc_id}:${channel}`, ta.value); });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); channel === "email" ? sendEmail() : copyLinkedin(); }
  });
  if ($("#send")) $("#send").onclick = sendEmail;
  if ($("#copyLi")) $("#copyLi").onclick = copyLinkedin;
}

function closeDetail(message = "") {
  selected = null; conv = null;
  $("#inbox").classList.remove("open");
  $("#detail").innerHTML = `<div class="ib-placeholder">${esc(message)}</div>`;
  renderList();
}

async function setDone(done) {
  const c = conv;
  await api(`/api/campaign-contacts/${c.cc_id}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done, seen: true }) });
  c.done = done;
  // la réponse quitte l'onglet courant : on passe à la suivante
  const list = visibleItems();
  const idx = list.findIndex((i) => i.cc_id === c.cc_id);
  items = items.filter((i) => i.cc_id !== c.cc_id);
  const rest = visibleItems();
  const next = rest[Math.min(idx, rest.length - 1)];
  if (next && window.innerWidth > 900) openReply(next.cc_id);
  else closeDetail(tab === "todo" && !rest.length ? "Tout est traité." : "");
  refreshCounts();
}

/** Envoi email annulable pendant quelques secondes, comme dans Gmail. */
function sendEmail() {
  const c = conv, ta = $("#reply");
  const text = ta.value.trim();
  if (!text) return notify("Écrivez d'abord votre réponse.", false);
  if (pendingSend) return;
  ta.disabled = true;
  const foot = $("#cfoot");
  const saved = foot.innerHTML;
  let left = Math.round(UNDO_MS / 1000);
  foot.innerHTML = `<span class="hint" id="countdown">Envoi dans ${left} s…</span><button class="ghost" id="undo">Annuler</button>`;
  const tick = setInterval(() => { left--; const el = $("#countdown"); if (el && left > 0) el.textContent = `Envoi dans ${left} s…`; }, 1000);
  const restore = () => { clearInterval(tick); pendingSend = null; ta.disabled = false; foot.innerHTML = saved; wireDetail(); };
  const timer = setTimeout(async () => {
    clearInterval(tick);
    $("#countdown") && ($("#countdown").textContent = "Envoi…");
    $("#undo")?.remove();
    try {
      await api(`/api/campaign-contacts/${c.cc_id}/reply`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: `${text}\n\n{{signature}}`, dry_run: false }),
      });
      pendingSend = null;
      store.set(`draft:${c.cc_id}:email`, "");
      notify("Réponse envoyée");
      refreshCounts();
      // Gmail met un instant à ranger l'envoi dans le fil
      setTimeout(() => { if (selected === c.cc_id) openReply(c.cc_id, { keepChannel: true }); }, 1500);
    } catch (e) {
      restore();
      notify(`Envoi impossible : ${e.message}`, false);
    }
  }, UNDO_MS);
  pendingSend = { timer };
  $("#undo").onclick = () => { clearTimeout(timer); restore(); notify("Envoi annulé"); };
}

async function copyLinkedin() {
  const c = conv, ta = $("#reply");
  const text = ta.value.trim();
  if (!text) return notify("Écrivez d'abord votre message.", false);
  const ok = await copyText(text);
  window.open(c.li_thread_url || liUrl(c.contact.linkedin), "_blank", "noopener");
  notify(ok ? "Message copié : collez-le dans LinkedIn" : "Copie impossible : copiez le texte à la main", ok);
}

document.addEventListener("click", () => { const m = $("#moreList"); if (m) m.hidden = true; });

// Raccourcis : j / k (ou ↓ / ↑) pour naviguer, e pour traiter, r pour répondre
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const list = visibleItems();
  const idx = list.findIndex((i) => i.cc_id === selected);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); const n = list[Math.min(idx + 1, list.length - 1)]; if (n) openReply(n.cc_id); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); const n = list[Math.max(idx - 1, 0)]; if (n) openReply(n.cc_id); }
  else if (e.key === "e" && conv) setDone(!conv.done);
  else if (e.key === "r" && $("#reply")) { e.preventDefault(); $("#reply").focus(); }
});

// ───────────────────────────── Démarrage ─────────────────────────────

(async () => {
  const m = location.hash.match(/cc=(\d+)/);
  await loadList();
  if (m) {
    const id = Number(m[1]);
    // lien depuis une campagne : la réponse peut être déjà traitée
    if (!items.some((i) => i.cc_id === id)) {
      tab = "done";
      $$("#tabs button").forEach((x) => x.classList.toggle("active", x.dataset.tab === "done"));
      await loadList();
    }
    openReply(id);
  } else if (window.innerWidth > 900 && items.length) openReply(visibleItems()[0].cc_id);
  setInterval(() => { if (!pendingSend) loadList(); }, 60000);
  window.addEventListener("hashchange", () => {
    const h = location.hash.match(/cc=(\d+)/);
    if (h && Number(h[1]) !== selected) openReply(Number(h[1]));
  });
})();
</script>
</body>
</html>
