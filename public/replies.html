<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Mail — Réponses</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body class="inbox-page">
<div class="inbox" id="inbox">
  <section class="ib-list">
    <div class="ib-list-head">
      <h1>Réponses</h1>
      <div class="ib-tabs" id="tabs">
        <button data-tab="todo" class="active">À traiter <span id="cTodo"></span></button>
        <button data-tab="done">Traitées</button>
        <button data-tab="all">Toutes</button>
      </div>
      <div class="ib-filters">
        <input id="q" type="search" placeholder="Nom, entreprise, email…">
        <select id="kind" title="Type de réponse">
          <option value="replied,opted_out">Réponses et refus</option>
          <option value="replied">Réponses</option>
          <option value="opted_out">Refus</option>
          <option value="bounced">Bounces</option>
        </select>
      </div>
      <select id="camp" style="margin:0;padding:6px 8px;font-size:12.5px"><option value="">Toutes les campagnes</option></select>
    </div>
    <div class="ib-items" id="items"><div class="ib-empty">Chargement…</div></div>
  </section>

  <section class="ib-detail" id="detail">
    <div class="ib-placeholder">Choisissez une réponse à gauche.</div>
  </section>
</div>

<script src="app.js?v=4"></script>
<script>
renderNav("replies.html");

const UNDO_MS = 5000; // délai pendant lequel un envoi peut être annulé
let tab = "todo";
let items = [];
const texts = new Map(); // cc_id → { text, error } : texte de la réponse, lu dans Gmail une fois
let selected = null; // cc_id ouvert
let conv = null; // conversation ouverte
let channel = "email"; // canal du compositeur
let pendingSend = null; // envoi en attente (annulable)

const fullName = (x) => [x.first_name, x.last_name].filter(Boolean).join(" ") || x.email || "Contact";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { v === "" || v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

/** « il y a 5 min », « 14:32 », « hier », « lun. », « 12 oct. » */
function when(ms) {
  if (!ms) return "";
  const d = new Date(ms), now = new Date();
  const diff = now - d;
  if (diff < 3600e3) return diff < 60e3 ? "à l'instant" : `il y a ${Math.floor(diff / 60e3)} min`;
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((day(now) - day(d)) / 86400e3);
  if (days === 0) return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (days === 1) return "hier";
  if (days < 7) return d.toLocaleDateString("fr-FR", { weekday: "short" });
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", ...(d.getFullYear() !== now.getFullYear() && { year: "numeric" }) });
}
/** Horodatage d'un message : « 14:32 » aujourd'hui, sinon « 17 oct., 22:28 ». */
function stamp(ms) {
  if (!ms) return "";
  const d = new Date(ms), t = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? t : `${d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}, ${t}`;
}
const fullDate = (ms) => (ms ? new Date(ms).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" }) : "");

// ───────────────────────────── Liste ─────────────────────────────

function query(includeText) {
  const p = new URLSearchParams({ status: $("#kind").value, limit: "200" });
  if (tab !== "all") p.set("done", tab === "done" ? "1" : "0");
  if ($("#camp").value) p.set("campaign_id", $("#camp").value);
  if (includeText) p.set("include_text", "1");
  return `/api/inbox?${p}`;
}

async function loadList() {
  const url = query(false);
  try {
    const rows = await api(url);
    if (url !== query(false)) return; // filtres changés entre-temps
    items = rows;
    renderList();
    loadTexts(url);
  } catch (e) {
    $("#items").innerHTML = `<div class="ib-empty err">${esc(e.message)}</div>`;
  }
  refreshCounts();
}

/** Textes des réponses (lus dans Gmail) : en second temps, pour afficher la liste sans attendre. */
async function loadTexts(listUrl) {
  if (items.every((i) => texts.has(i.cc_id))) return;
  try {
    const rows = await api(query(true));
    for (const r of rows) texts.set(r.cc_id, { text: r.reply_text ?? null, error: r.reply_error ?? null });
    if (listUrl === query(false)) renderList();
  } catch {}
}

async function refreshCounts() {
  try {
    const { todo } = await api("/api/inbox/counts");
    $("#cTodo").textContent = todo ? `(${todo})` : "";
  } catch {}
  refreshNavBadge();
}

function visibleItems() {
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return items;
  return items.filter((i) => [fullName(i), i.company, i.email, i.campaign_name, i.poste].filter(Boolean).join(" ").toLowerCase().includes(q));
}

function snippet(i) {
  const t = texts.get(i.cc_id);
  if (!t) return `<div class="snip wait">…</div>`;
  if (t.error) return `<div class="snip wait">${esc(t.error)}</div>`;
  if (!t.text) return `<div class="snip wait">${i.channel === "linkedin" ? "Réponse sur LinkedIn" : "Réponse sans texte lisible"}</div>`;
  return `<div class="snip">${esc(t.text.replace(/\s+/g, " "))}</div>`;
}

function renderList() {
  const list = visibleItems();
  if (!list.length) {
    $("#items").innerHTML = `<div class="ib-empty">${tab === "todo" ? "Aucune réponse à traiter." : "Aucune réponse."}</div>`;
    return;
  }
  $("#items").innerHTML = list.map((i) => `
    <div class="ib-item ${i.cc_id === selected ? "sel" : ""} ${i.seen ? "" : "unseen"}" data-cc="${i.cc_id}">
      <div class="l1"><span class="who">${esc(fullName(i))}</span><span class="when" title="${esc(fullDate(i.replied_at))}">${esc(when(i.replied_at))}</span></div>
      <div class="co">${esc([i.company, i.poste].filter(Boolean).join(" · ") || i.email || "")}</div>
      ${snippet(i)}
      <div class="tags">
        <span class="chan ${i.channel}">${i.channel === "linkedin" ? "in LinkedIn" : "✉ Email"}</span>
        ${i.status !== "replied" ? pill(i.status) : ""}
        <span class="camp">${esc(i.campaign_name)}</span>
      </div>
    </div>`).join("");
}

$("#items").addEventListener("click", (e) => {
  const el = e.target.closest(".ib-item");
  if (el) openReply(Number(el.dataset.cc));
});
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  tab = b.dataset.tab;
  $$("#tabs button").forEach((x) => x.classList.toggle("active", x === b));
  loadList();
});
$("#kind").addEventListener("change", loadList);
$("#camp").addEventListener("change", loadList);
$("#q").addEventListener("input", renderList);

// ───────────────────────────── Conversation ─────────────────────────────

async function openReply(ccId, { keepComposer = false } = {}) {
  if (pendingSend) return notify("Un envoi est en attente : annulez-le ou attendez qu'il parte.", false);
  selected = ccId;
  history.replaceState(null, "", `#cc=${ccId}`);
  $("#inbox").classList.add("open");
  renderList();
  if (!keepComposer) $("#detail").innerHTML = `<div class="ib-placeholder">Chargement…</div>`;
  try {
    const c = await api(`/api/campaign-contacts/${ccId}/conversation`);
    if (selected !== ccId) return;
    conv = c;
    const item = items.find((i) => i.cc_id === ccId);
    if (!keepComposer) channel = defaultChannel(c, item);
    renderDetail();
    if (!c.seen) {
      api(`/api/campaign-contacts/${ccId}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ seen: true }) })
        .then(() => { if (item) { item.seen = true; renderList(); } refreshCounts(); })
        .catch(() => {});
    }
  } catch (e) {
    $("#detail").innerHTML = `<div class="ib-placeholder err">${esc(e.message)}</div>`;
  }
}

const canEmail = (c) => Boolean(c.contact.email && (c.email_thread || c.gmail_url));
const canLinkedin = (c) => Boolean(c.contact.linkedin || c.li_thread_url);
function defaultChannel(c, item) {
  const preferred = item?.channel ?? (c.li_thread_url ? "linkedin" : "email");
  if (preferred === "email" && canEmail(c)) return "email";
  if (canLinkedin(c)) return "linkedin";
  return canEmail(c) ? "email" : "none";
}

/** Fil chronologique : emails du fil Gmail, actions LinkedIn, réponse lue dans la messagerie LinkedIn. */
function timeline(c) {
  const ev = [];
  for (const m of c.email_thread ?? []) ev.push({ at: m.date, type: "mail", m });
  let last = 0;
  for (const a of c.linkedin ?? []) {
    last = a.sent_at ?? last;
    ev.push({ at: a.sent_at ?? last, type: "li", a });
  }
  if (c.li_reply_text) ev.push({ at: c.replied_at ?? Date.now(), type: "lireply" });
  if (!c.email_thread) for (const s of c.steps_sent ?? []) ev.push({ at: s.sent_at, type: "step", s });
  return ev.sort((x, y) => (x.at ?? 0) - (y.at ?? 0));
}

function bubble({ dir, who, whoTitle, chan, at, body, full, clamp, optout, note }) {
  const id = "m" + Math.random().toString(36).slice(2, 8);
  const quoted = full && full.trim() !== body.trim();
  return `
    <div class="msg ${dir} ${clamp ? "clamp" : ""} ${optout ? "optout" : ""}" id="${id}">
      <div class="msg-h"><b title="${esc(whoTitle || "")}">${esc(who)}</b>${chan ? `<span class="chan ${chan}">${chan === "linkedin" ? "in LinkedIn" : "✉ Email"}</span>` : ""}${note ? `<span title="${esc(note.title)}">${esc(note.label)}</span>` : ""}<span class="t" title="${esc(fullDate(at))}">${esc(stamp(at))}</span></div>
      <div class="msg-b" data-short="${esc(body)}" data-full="${esc(full || body)}">${esc(body)}</div>
      ${clamp ? `<button class="msg-more" data-act="expand">Afficher tout</button>` : quoted ? `<button class="msg-more" data-act="quoted">Afficher le message cité</button>` : ""}
    </div>`;
}

function renderThread(c) {
  const me = "Vous";
  const them = fullName(c.contact);
  const ev = timeline(c);
  const lastOut = [...ev].reverse().find((e) => (e.type === "mail" && e.m.direction === "out") || (e.type === "li" && e.a.type === "message" && e.a.status === "sent"));
  const html = [];
  if (c.email_thread_error) html.push(`<div class="notice">Fil Gmail illisible : ${esc(c.email_thread_error)}</div>`);
  for (const e of ev) {
    if (e.type === "mail") {
      const m = e.m;
      if (m.kind === "bounce") { html.push(`<div class="evt bad" title="${esc(m.text.slice(0, 400))}">Email non remis (bounce) · ${esc(fullDate(m.date))}</div>`); continue; }
      if (m.kind === "auto_reply") { html.push(`<div class="evt" title="${esc(m.text.slice(0, 400))}">Réponse automatique · ${esc(fullDate(m.date))}</div>`); continue; }
      if (m.direction === "out") html.push(bubble({ dir: "out", who: me, whoTitle: c.sender, chan: "email", at: m.date, body: m.text.trim(), clamp: e !== lastOut }));
      else html.push(bubble({ dir: "in", who: them, chan: "email", at: m.date, body: m.text_clean || m.text.trim(), full: m.text.trim(), optout: c.status === "opted_out" }));
    } else if (e.type === "li") {
      const a = e.a;
      const label = a.type === "invite" ? "Invitation LinkedIn" : "Message LinkedIn";
      if (a.status !== "sent") {
        // « cancelled » : étape suivante annulée par la réponse elle-même, rien à montrer
        if (a.status === "failed") html.push(`<div class="evt bad">${label} non envoyé${a.type === "invite" ? "e" : ""}${a.error ? ` — ${esc(a.error)}` : ""}</div>`);
        continue;
      }
      if (a.type === "invite" && !a.body) html.push(`<div class="evt">Invitation LinkedIn envoyée · ${esc(fullDate(a.sent_at))}</div>`);
      else html.push(bubble({ dir: "out", who: me, whoTitle: c.li_sender ? `compte LinkedIn ${c.li_sender}` : "", chan: "linkedin", at: a.sent_at, body: (a.type === "invite" ? "Note d'invitation :\n" : "") + (a.body || "").trim(), clamp: e !== lastOut }));
    } else if (e.type === "lireply") {
      html.push(bubble({ dir: "in", who: them, chan: "linkedin", at: e.at, body: c.li_reply_text.trim(), optout: c.status === "opted_out",
        note: { label: "· aperçu", title: "Texte lu dans la liste des conversations LinkedIn : il peut être tronqué. Le message complet est sur LinkedIn." } }));
    } else if (e.type === "step") {
      html.push(`<div class="evt">Email étape ${e.s.step_number} envoyé · ${esc(fullDate(e.s.sent_at))}</div>`);
    }
  }
  if (!ev.length) html.push(`<div class="evt">Aucun échange enregistré.</div>`);
  return html.join("");
}

function lastSubject(c) {
  const m = [...(c.email_thread ?? [])].reverse().find((x) => x.kind === "sent" || x.kind === "reply");
  const s = (m?.subject || "").replace(/^\s*((re|ré|réf|ref|rép|aw|sv)\.?\s*(\[\d+\])?\s*:\s*)+/iu, "").trim();
  return s ? `Re: ${s}` : "";
}

function renderComposer(c) {
  if (channel === "none") return `<div class="composer"><div class="hint">Ni email ni profil LinkedIn connu pour ce contact.</div></div>`;
  const tabs = [canEmail(c) && "email", canLinkedin(c) && "linkedin"].filter(Boolean);
  const first = c.contact.first_name || fullName(c.contact);
  const draftKey = `draft:${c.cc_id}:${channel}`;
  const head = channel === "email"
    ? `De <b>${esc(c.sender || "")}</b> · À <b>${esc(c.contact.email)}</b>${lastSubject(c) ? ` · <b>${esc(lastSubject(c))}</b>` : ""}`
    : `Sur LinkedIn${c.li_sender ? ` · compte <b>${esc(c.li_sender)}</b>` : ""}`;
  return `
    <div class="composer" id="composer">
      ${tabs.length > 1 ? `<div class="ctabs">${tabs.map((t) => `<button data-chan="${t}" class="${t === channel ? "active" : ""}">${t === "email" ? "✉ Email" : "in LinkedIn"}</button>`).join("")}</div>` : ""}
      <div class="chead">${head}</div>
      <textarea id="reply" placeholder="Répondre à ${esc(first)}…">${esc(store.get(draftKey, ""))}</textarea>
      <div class="cfoot" id="cfoot">
        ${channel === "email"
          ? `<button id="send">Envoyer</button>
             <label><input type="checkbox" id="sig" ${store.get("reply:sig", "1") === "1" ? "checked" : ""}> Ajouter ma signature</label>
             <span class="spacer"></span><span class="hint"><kbd>⌘</kbd> <kbd>↵</kbd> pour envoyer</span>`
          : `<button id="copyLi">Copier et ouvrir LinkedIn</button><span class="spacer"></span>`}
      </div>
    </div>`;
}

function renderDetail() {
  const c = conv;
  const extra = c.contact.extra || {};
  const item = items.find((i) => i.cc_id === c.cc_id);
  const liLink = c.li_thread_url || (c.contact.linkedin ? liUrl(c.contact.linkedin) : "");
  $("#detail").innerHTML = `
    <div class="ib-head">
      <button class="ghost ib-back" id="back">←</button>
      <div class="id">
        <h2>${esc(fullName(c.contact))} ${c.status !== "replied" ? pill(c.status) : ""}</h2>
        <div class="sub">${esc([extra.poste, c.contact.company].filter(Boolean).join(" · "))}</div>
        <div class="meta">
          ${c.contact.email ? `<a href="#" id="copyEmail" title="Copier l'adresse">${esc(c.contact.email)}</a>` : ""}
          <a href="campaigns.html#${c.campaign.id}">${esc(c.campaign.name)}</a>
          ${extra.offre ? `<span>Offre citée : ${esc(extra.offre)}</span>` : ""}
          ${c.replied_at ? `<span>Réponse le ${esc(fullDate(c.replied_at))}</span>` : ""}
        </div>
      </div>
      <div class="acts">
        ${c.gmail_url ? `<a class="btn ghost" href="${esc(c.gmail_url)}" target="_blank" rel="noopener" title="Ouvrir le fil dans Gmail">Gmail ↗</a>` : ""}
        ${liLink ? `<a class="btn ghost" href="${esc(liLink)}" target="_blank" rel="noopener" title="${c.li_thread_url ? "Ouvrir la conversation LinkedIn" : "Ouvrir le profil LinkedIn"}">LinkedIn ↗</a>` : ""}
        <button class="${c.done ? "ghost" : ""}" id="done" title="Raccourci : e">${c.done ? "Remettre à traiter" : "Traitée ✓"}</button>
        <div class="menu"><button class="icon-btn" id="more">⋯</button>
          <div class="menu-list" id="moreList" hidden><button id="unseen">Marquer comme non lue</button></div>
        </div>
      </div>
    </div>
    <div class="ib-thread" id="thread">${renderThread(c)}</div>
    ${renderComposer(c)}`;
  const th = $("#thread");
  th.scrollTop = th.scrollHeight;
  wireDetail(item);
}

function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.4) + "px"; }

function wireDetail(item) {
  const c = conv;
  $("#back").onclick = () => { $("#inbox").classList.remove("open"); selected = null; renderList(); };
  $("#done").onclick = () => setDone(!c.done);
  $("#more").onclick = (e) => { e.stopPropagation(); $("#moreList").hidden = !$("#moreList").hidden; };
  $("#unseen").onclick = async () => {
    await api(`/api/campaign-contacts/${c.cc_id}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ seen: false }) });
    if (item) item.seen = false;
    selected = null; conv = null;
    $("#inbox").classList.remove("open");
    $("#detail").innerHTML = `<div class="ib-placeholder">Choisissez une réponse à gauche.</div>`;
    renderList(); refreshCounts();
  };
  const ce = $("#copyEmail");
  if (ce) ce.onclick = async (e) => { e.preventDefault(); notify((await copyText(c.contact.email)) ? "Adresse copiée" : "Copie impossible", true); };
  $("#thread").addEventListener("click", (e) => {
    const b = e.target.closest(".msg-more");
    if (!b) return;
    const msg = b.closest(".msg"), body = $(".msg-b", msg);
    if (b.dataset.act === "expand") { msg.classList.remove("clamp"); b.remove(); }
    else {
      const showFull = b.textContent.startsWith("Afficher");
      body.textContent = showFull ? body.dataset.full : body.dataset.short;
      b.textContent = showFull ? "Masquer le message cité" : "Afficher le message cité";
    }
  });
  $$("#composer .ctabs button").forEach((b) => (b.onclick = () => { channel = b.dataset.chan; renderDetail(); }));
  const ta = $("#reply");
  if (!ta) return;
  autosize(ta);
  ta.addEventListener("input", () => { autosize(ta); store.set(`draft:${c.cc_id}:${channel}`, ta.value); });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); channel === "email" ? sendEmail() : copyLinkedin(); }
  });
  const sig = $("#sig");
  if (sig) sig.onchange = () => store.set("reply:sig", sig.checked ? "1" : "0");
  if ($("#send")) $("#send").onclick = sendEmail;
  if ($("#copyLi")) $("#copyLi").onclick = copyLinkedin;
}

async function setDone(done) {
  const c = conv;
  await api(`/api/campaign-contacts/${c.cc_id}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done, seen: true }) });
  c.done = done;
  const item = items.find((i) => i.cc_id === c.cc_id);
  if (item) item.done = done;
  notify(done ? "Rangée dans « Traitées »" : "Remise dans « À traiter »");
  // la réponse quitte l'onglet courant : on passe à la suivante
  if ((tab === "todo" && done) || (tab === "done" && !done)) {
    const list = visibleItems();
    const idx = list.findIndex((i) => i.cc_id === c.cc_id);
    items = items.filter((i) => i.cc_id !== c.cc_id);
    const next = visibleItems()[Math.min(idx, visibleItems().length - 1)];
    renderList();
    if (next && window.innerWidth > 900) openReply(next.cc_id);
    else { selected = null; $("#inbox").classList.remove("open"); $("#detail").innerHTML = `<div class="ib-placeholder">${tab === "todo" ? "Tout est traité." : "Choisissez une réponse à gauche."}</div>`; }
  } else renderDetail();
  refreshCounts();
}

/** Envoi email annulable pendant quelques secondes, comme dans Gmail. */
function sendEmail() {
  const c = conv, ta = $("#reply");
  const text = ta.value.trim();
  if (!text) return notify("Écrivez d'abord votre réponse.", false);
  if (pendingSend) return;
  const body = text + ($("#sig")?.checked ? "\n\n{{signature}}" : "");
  ta.disabled = true;
  const foot = $("#cfoot");
  const saved = foot.innerHTML;
  let left = Math.round(UNDO_MS / 1000);
  foot.innerHTML = `<span class="hint" id="countdown">Envoi à ${esc(c.contact.email)} dans ${left} s…</span><button class="ghost" id="undo">Annuler</button>`;
  const tick = setInterval(() => { left--; const el = $("#countdown"); if (el && left > 0) el.textContent = `Envoi à ${c.contact.email} dans ${left} s…`; }, 1000);
  const restore = () => { clearInterval(tick); pendingSend = null; ta.disabled = false; foot.innerHTML = saved; wireDetail(items.find((i) => i.cc_id === c.cc_id)); };
  const timer = setTimeout(async () => {
    clearInterval(tick);
    $("#countdown") && ($("#countdown").textContent = "Envoi…");
    $("#undo")?.remove();
    try {
      await api(`/api/campaign-contacts/${c.cc_id}/reply`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body, dry_run: false }) });
      pendingSend = null;
      store.set(`draft:${c.cc_id}:email`, "");
      notify("Réponse envoyée");
      const item = items.find((i) => i.cc_id === c.cc_id);
      if (item) item.done = true;
      refreshCounts();
      // Gmail met un instant à ranger l'envoi dans le fil
      setTimeout(() => { if (selected === c.cc_id) openReply(c.cc_id, { keepComposer: true }); }, 1500);
    } catch (e) {
      restore();
      notify(`Envoi impossible : ${e.message}`, false);
    }
  }, UNDO_MS);
  pendingSend = { timer };
  $("#undo").onclick = () => { clearTimeout(timer); restore(); notify("Envoi annulé"); };
}

async function copyLinkedin() {
  const c = conv, ta = $("#reply");
  const text = ta.value.trim();
  if (!text) return notify("Écrivez d'abord votre message.", false);
  const ok = await copyText(text);
  window.open(c.li_thread_url || liUrl(c.contact.linkedin), "_blank", "noopener");
  notify(ok ? "Message copié : collez-le dans la conversation LinkedIn" : "Copie impossible : copiez le texte à la main", ok);
}

document.addEventListener("click", () => { const m = $("#moreList"); if (m) m.hidden = true; });

// Raccourcis : j / k (ou ↓ / ↑) pour naviguer, e pour traiter, r pour répondre
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const list = visibleItems();
  const idx = list.findIndex((i) => i.cc_id === selected);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); const n = list[Math.min(idx + 1, list.length - 1)]; if (n) openReply(n.cc_id); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); const n = list[Math.max(idx - 1, 0)]; if (n) openReply(n.cc_id); }
  else if (e.key === "e" && conv) setDone(!conv.done);
  else if (e.key === "r" && $("#reply")) { e.preventDefault(); $("#reply").focus(); }
});

// ───────────────────────────── Démarrage ─────────────────────────────

(async () => {
  try {
    const camps = await api("/api/campaigns");
    $("#camp").insertAdjacentHTML("beforeend", camps.map((c) => `<option value="${c.id}">${esc(c.name)}${c.status === "archived" ? " (archivée)" : ""}</option>`).join(""));
  } catch {}
  const m = location.hash.match(/cc=(\d+)/);
  await loadList();
  if (m) {
    const id = Number(m[1]);
    // lien depuis une campagne : la réponse peut être déjà traitée
    if (!items.some((i) => i.cc_id === id)) {
      tab = "all";
      $$("#tabs button").forEach((x) => x.classList.toggle("active", x.dataset.tab === "all"));
      await loadList();
    }
    openReply(id);
  }
  setInterval(() => { if (!pendingSend) loadList(); }, 60000);
  // lien #cc=… suivi alors que la page est déjà ouverte
  window.addEventListener("hashchange", () => {
    const h = location.hash.match(/cc=(\d+)/);
    if (h && Number(h[1]) !== selected) openReply(Number(h[1]));
  });
})();
</script>
