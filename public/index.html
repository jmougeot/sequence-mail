<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Mail — Tableau de bord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Tableau de bord</h1>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>Comparaison des campagnes</h2>
    <table id="campaigns"><thead><tr>
      <th>Campagne</th><th>Statut</th><th>Contacts</th><th>Emails envoyés</th><th>Réponses</th><th>Taux de réponse</th><th>Progression</th><th></th>
    </tr></thead><tbody></tbody></table>
    <p><a class="btn" href="campaigns.html#new">+ Nouvelle campagne</a></p>
  </div>
</div>

<script src="app.js"></script>
<script>
renderNav("index.html");

const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

async function refresh() {
  const [accounts, campaigns] = await Promise.all([api("/api/accounts"), api("/api/campaigns")]);
  const today = new Date().toISOString().slice(0, 10);
  const activeAcc = accounts.filter(a => a.active).length;
  const sentToday = accounts.reduce((n, a) => n + (a.sent_today_date === today ? a.sent_today : 0), 0);
  const quota = accounts.filter(a => a.active).reduce((n, a) => n + a.daily_limit, 0);
  const inProgress = campaigns.reduce((n, c) => n + c.in_progress + c.pending + (c.awaiting_li || 0), 0);
  const replied = campaigns.reduce((n, c) => n + c.replied, 0);

  const mini = ratio => `<div class="mini"><div style="width:${Math.round(Math.min(1, ratio) * 100)}%"></div></div>`;
  $("#kpis").innerHTML = [
    { v: `${activeAcc} / ${accounts.length}`, l: "comptes actifs", bar: accounts.length ? activeAcc / accounts.length : 0 },
    { v: `${sentToday} / ${quota}`, l: "envoyés aujourd'hui", bar: quota ? sentToday / quota : 0 },
    { v: inProgress, l: "contacts dans le workflow" },
    { v: replied, l: "réponses obtenues" },
  ].map(k => `<div class="kpi"><div class="v">${k.v}</div><div class="l">${k.l}</div>${k.bar != null ? mini(k.bar) : ""}</div>`).join("");

  $("#campaigns tbody").innerHTML = campaigns.map(c => `
    <tr>
      <td>
        <a href="campaigns.html#${c.id}" class="camp-name">${esc(c.name)}</a>
        <div class="muted">#${c.id} · ${plural(c.steps, "étape")}</div>
      </td>
      <td>${pill(c.status)}</td>
      <td>${c.contacts}${c.bounced ? `<div class="subnum"><span class="dot bad"></span>${plural(c.bounced, "bounce")}</div>` : ""}</td>
      <td>${c.emails_sent}${c.li_steps ? `<div class="subnum"><span class="dot li"></span>${c.li_invites_sent} inv. · ${c.li_messages_sent} msg. LinkedIn</div>` : ""}</td>
      <td>${c.replied}${c.opted_out ? `<div class="subnum"><span class="dot warn"></span>${plural(c.opted_out, "désinscrit")}</div>` : ""}</td>
      <td><span class="rate">${c.reply_rate}%</span>${c.ab_test ? `<div class="subnum">A ${c.reply_rate_a}% · B ${c.reply_rate_b}%</div>` : ""}</td>
      <td style="min-width:150px"><div class="prog"><div class="bar"><div style="width:${c.progress}%"></div></div><span class="pv">${c.progress}%</span></div></td>
      <td><a class="btn ghost" href="campaigns.html#${c.id}">Gérer</a></td>
    </tr>
  `).join("") || '<tr><td colspan="8" class="muted">Aucune campagne — créez-en une depuis la page Campagnes.</td></tr>';
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
