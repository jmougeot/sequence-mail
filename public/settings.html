<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Mail — Paramètres</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
  <h1>Paramètres</h1>

  <div class="card">
    <div class="inline" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Comptes email</h2>
      <a class="btn" href="/auth/google">+ Connecter un compte Google</a>
    </div>
    <p class="err" id="googleWarn" hidden>Google OAuth non configuré (.env)</p>
    <table id="accounts"><thead><tr>
      <th>Email</th><th>Nom d'expéditeur</th>
      <th title="Insérée à l'emplacement de {{signature}} dans les étapes">Signature</th>
      <th>Envois / jour</th>
      <th id="warmupTh">Warm-up</th>
      <th title="Décoché tout seul : accès Google révoqué, reconnecter la même adresse">Actif</th>
      <th></th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <div class="inline" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Comptes LinkedIn</h2>
      <button id="liToggle" class="ghost" hidden onclick="toggleLi()"></button>
    </div>
    <p class="err" id="liWarn" hidden></p>
    <table id="liAccounts">
      <thead><tr><th>Compte</th><th>Exécution</th><th>Invitations / jour</th><th>Messages / jour</th><th id="liQueueTh">En file</th><th>Actif</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="inline" style="margin-top:12px">
      <input id="liNewName" placeholder="Nom du compte" style="width:220px">
      <button onclick="addLiAccount()">+ Ajouter un compte LinkedIn</button>
    </div>
    <div id="liToken" class="card" hidden style="margin:12px 0 0;background:var(--hover)"></div>
  </div>
</div>

<script src="app.js?v=3"></script>
<script>
renderNav("settings.html");

const connected = new URLSearchParams(location.search).get("connected");
if (connected) {
  notify(`${connected} connecté`);
  history.replaceState(null, "", location.pathname);
}

const jsonPost = (method, body) => ({ method, headers: {"Content-Type":"application/json"}, body: JSON.stringify(body ?? {}) });
const fail = (e) => notify(e.message || String(e), false);

// Ne pas réécrire un tableau pendant une saisie
function typingIn(sel) {
  const el = document.activeElement;
  return el && $(sel).contains(el) && el.matches("input:not([type=checkbox]), textarea, select");
}

// --- Comptes email ---
let accounts = [];

async function updateAccount(id, patch) {
  try { await api(`/api/accounts/${id}`, jsonPost("PATCH", patch)); }
  catch (e) { fail(e); }
  refresh();
}

async function deleteAccount(id) {
  const a = accounts.find(x => x.id === id);
  if (!a || !confirm(`Supprimer ${a.email} ?\nSon historique d'envois est effacé et ses contacts encore en séquence sont arrêtés.`)) return;
  try {
    // L'API ne supprime qu'un compte désactivé
    if (a.active) await api(`/api/accounts/${id}`, jsonPost("PATCH", { active: false }));
    const r = await api(`/api/accounts/${id}`, { method: "DELETE" });
    notify(`${a.email} supprimé` + (r.contacts_stopped ? ` · ${r.contacts_stopped} contact(s) arrêté(s)` : ""));
  } catch (e) { fail(e); }
  refresh();
}

async function refresh() {
  if (typingIn("#accounts")) return;
  accounts = await api("/api/accounts");
  const today = new Date().toISOString().slice(0, 10);
  $("#accounts tbody").innerHTML = accounts.map(a => `
    <tr><td>${esc(a.email)}</td>
    <td><input value="${esc(a.from_name)}" placeholder="Jacques M." style="width:150px" onchange="updateAccount(${a.id}, {from_name: this.value})"></td>
    <td><textarea style="min-height:40px; width:240px" placeholder="Cordialement,&#10;Jacques" onchange="updateAccount(${a.id}, {signature: this.value})">${esc(a.signature)}</textarea></td>
    <td style="white-space:nowrap">${a.sent_today_date === today ? a.sent_today : 0} / <input type="number" min="0" value="${a.daily_limit}" style="width:70px" onchange="updateAccount(${a.id}, {daily_limit: +this.value})">
      ${a.warmup && a.effective_limit < a.daily_limit ? `<div class="muted">warm-up : ${a.effective_limit}/j</div>` : ""}</td>
    <td><input type="checkbox" ${a.warmup ? "checked" : ""} onchange="updateAccount(${a.id}, {warmup: this.checked})"></td>
    <td><input type="checkbox" ${a.active ? "checked" : ""} onchange="updateAccount(${a.id}, {active: this.checked})"></td>
    <td><button class="icon-btn danger" title="Supprimer" onclick="deleteAccount(${a.id})">✕</button></td></tr>
  `).join("") || '<tr><td colspan="7" class="muted">Aucun compte connecté</td></tr>';
}

async function loadSettings() {
  const s = await api("/api/settings");
  const d = s.deliverability;
  $("#googleWarn").hidden = s.google_configured;
  $("#warmupTh").title = `Montée en charge : ${d.warmupStart} emails/jour au départ, +${d.warmupRamp} par semaine jusqu'au quota`;
}

// --- Comptes LinkedIn (une extension Chrome par compte) ---
let li = { enabled: true, accounts: [] };

function liWarn(lines) {
  $("#liWarn").innerHTML = lines.map(esc).join("<br>");
  $("#liWarn").hidden = !lines.length;
}

async function loadLi() {
  try { li = await api("/api/li/status"); }
  catch { return liWarn(["Statut LinkedIn indisponible."]); }
  const s = li;

  liWarn(!s.server_mode_ready && s.accounts.some(a => a.mode === "server")
    ? ["Mode serveur indisponible : LI_SECRET_KEY / LI_RUNNER_SECRET manquants (.env)"] : []);
  $("#liQueueTh").textContent = "En file" + (s.queue.unassigned ? ` (+${s.queue.unassigned} sans compte)` : "");
  const btn = $("#liToggle");
  btn.hidden = !s.accounts.length;
  btn.textContent = s.enabled ? "⏸ Tout mettre en pause" : "▶ Tout réactiver";

  if (typingIn("#liAccounts")) return;
  $("#liAccounts tbody").innerHTML = s.accounts.map(a => {
    const server = a.mode === "server";
    const state = a.paused_until ? `<div class="err">pause jusqu'à ${new Date(a.paused_until).toLocaleString("fr-FR", {weekday:"short", hour:"2-digit", minute:"2-digit"})}</div>` : "";
    // Session du navigateur serveur : seuls les problèmes s'affichent
    const sessLabel = { wrong_account: "mauvais profil connecté", expired: "session expirée", checkpoint: "session bloquée" }[a.session.state] || "session manquante";
    const sess = !server || a.session.state === "ok" ? ""
      : `<div class="err" title="${esc([a.session.error, "À renvoyer depuis l'extension"].filter(Boolean).join(" — "))}">${sessLabel}</div>`;
    const proxy = !server ? "" : `<div><input value="" title="Proxy résidentiel ou ISP fixe, propre au compte : sans proxy, le serveur ne lance rien" placeholder="${a.has_proxy ? "proxy configuré ✓ (remplacer…)" : "⚠️ proxy http://user:mdp@hôte:port"}" style="width:220px" onchange="patchLi(${a.id}, {proxy: this.value})"></div>`;
    const quota = (kind, field, label) => `<td style="white-space:nowrap">${a.today[kind].sent} / <input type="number" min="0" value="${a[field]}" title="${label} / jour" style="width:60px" onchange="patchLi(${a.id}, {${field}: this.value})">
        ${a.today[kind].cap < a[field] ? `<div class="muted">warm-up : ${a.today[kind].cap}/j</div>` : ""}</td>`;
    return `<tr>
      <td><input value="${esc(a.name)}" style="width:150px" onchange="patchLi(${a.id}, {name: this.value})">
        ${a.member ? `<div><a href="${esc(a.member.url)}" target="_blank" rel="noopener" title="Profil vérifié avant chaque action">✓ ${esc(a.member.name || a.member.slug)}</a></div>` : `<div class="muted">profil non vérifié</div>`}
        ${a.owner_ref ? `<div class="muted" title="Compte d'un utilisateur Azerit : ses campagnes seulement">client ${esc(a.owner_ref)}</div>` : ""}</td>
      <td><select style="width:170px" onchange="patchLi(${a.id}, {mode: this.value})">
          <option value="extension" ${server ? "" : "selected"}>Extension Chrome</option>
          <option value="server" ${server ? "selected" : ""}>Navigateur serveur</option></select>
        <div><span style="width:9px;height:9px;border-radius:50%;background:var(--${a.connected ? "ok" : "bad"});display:inline-block"></span>
        <span class="muted">${a.last_seen_at ? `vu ${timeAgo(a.last_seen_at)}` : "jamais vu"}</span></div>${sess}${proxy}${state}</td>
      ${quota("invite", "invites_per_day", "Invitations")}
      ${quota("message", "messages_per_day", "Messages")}
      <td>${a.queue.pending}${a.queue.failed ? ` <span class="err">· ${a.queue.failed} échec(s)</span>` : ""}</td>
      <td><input type="checkbox" ${a.active ? "checked" : ""} onchange="patchLi(${a.id}, {active: this.checked})"></td>
      <td style="white-space:nowrap"><button class="ghost" onclick="rotateLi(${a.id})" title="Générer un nouveau jeton (l'ancien cesse de fonctionner)">Jeton</button>
          <button class="icon-btn danger" onclick="deleteLi(${a.id})" title="Supprimer (seulement si le compte n'a encore rien fait)">✕</button></td>
    </tr>`;
  }).join("") || '<tr><td colspan="7" class="muted">Aucun compte LinkedIn</td></tr>';
}

let shownToken = "";

function showToken(name, token) {
  shownToken = token;
  const box = $("#liToken");
  box.hidden = false;
  box.innerHTML = `<b>Jeton de « ${esc(name)} »</b> <span class="muted">affiché une seule fois</span>
    <div class="inline" style="margin-top:8px"><code style="user-select:all;word-break:break-all">${esc(token)}</code>
    <button class="ghost" onclick="copyText(shownToken).then(ok => ok && notify('Jeton copié'))">Copier</button>
    <button class="ghost" onclick="$('#liToken').hidden = true">Fermer</button></div>`;
}

async function addLiAccount() {
  const name = $("#liNewName").value.trim();
  if (!name) return $("#liNewName").focus();
  try {
    const a = await api("/api/li/accounts", jsonPost("POST", { name }));
    $("#liNewName").value = "";
    showToken(a.name, a.token);
  } catch (e) { fail(e); }
  loadLi();
}

async function patchLi(id, patch) {
  try { await api(`/api/li/accounts/${id}`, jsonPost("PATCH", patch)); }
  catch (e) { fail(e); }
  loadLi();
}

async function rotateLi(id) {
  if (!confirm("Générer un nouveau jeton ? L'extension qui utilise l'ancien sera refusée jusqu'à ce que vous y colliez le nouveau.")) return;
  try {
    const r = await api(`/api/li/accounts/${id}/token`, jsonPost("POST"));
    const a = li.accounts.find(x => x.id === id);
    showToken(a ? a.name : `#${id}`, r.token);
  } catch (e) { fail(e); }
}

async function deleteLi(id) {
  if (!confirm("Supprimer ce compte LinkedIn ?")) return;
  try { await api(`/api/li/accounts/${id}`, { method: "DELETE" }); }
  catch (e) { fail(e); }
  loadLi();
}

function timeAgo(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return new Date(ts).toLocaleString("fr-FR");
}

async function toggleLi() {
  try { await api("/api/li/toggle", jsonPost("POST", { enabled: !li.enabled })); }
  catch (e) { fail(e); }
  loadLi();
}

refresh();
loadSettings();
loadLi();
setInterval(refresh, 30000);
setInterval(loadLi, 5000);
</script>
</body>
</html>
